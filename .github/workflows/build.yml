name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.rust }}
        override: true
        components: rustfmt
    
    - name: Check formatting
      uses: actions-rs/cargo@v1
      with:
        command: fmt
        args: -- --check
    
    - name: Build project
      uses: actions-rs/cargo@v1
      with:
        command: build
        args: --verbose
    
    - name: Build tests
      uses: actions-rs/cargo@v1
      with:
        command: test
        args: --no-run --verbose

  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.rust }}
        override: true
    
    - name: Run unit tests
      uses: actions-rs/cargo@v1
      with:
        command: test
        args: --lib --bins --verbose
      env:
        RUST_BACKTRACE: 1

  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.rust }}
        override: true
    
    - name: Build binary for integration tests
      uses: actions-rs/cargo@v1
      with:
        command: build
        args: --bin stalmarck_sat
    
    - name: Run integration tests
      uses: actions-rs/cargo@v1
      with:
        command: test
        args: --test integration_tests --verbose
      env:
        RUST_BACKTRACE: 1

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
    - name: Check test results
      run: |
        if [[ "${{ needs.unit-tests.result }}" == "success" && "${{ needs.integration-tests.result }}" == "success" ]]; then
          echo "✅ All tests passed successfully!"
          exit 0
        else
          echo "❌ Some tests failed:"
          echo "  Unit tests: ${{ needs.unit-tests.result }}"
          echo "  Integration tests: ${{ needs.integration-tests.result }}"
          exit 1
        fi