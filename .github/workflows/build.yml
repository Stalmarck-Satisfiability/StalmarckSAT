name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.rust }}
        override: true
        components: rustfmt
    
    - name: Check formatting
      uses: actions-rs/cargo@v1
      with:
        command: fmt
        args: -- --check
    
    - name: Build project
      uses: actions-rs/cargo@v1
      with:
        command: build
        args: --verbose
    
    - name: Build tests
      uses: actions-rs/cargo@v1
      with:
        command: test
        args: --no-run --verbose

  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.rust }}
        override: true
    
    - name: Run unit tests
      uses: actions-rs/cargo@v1
      with:
        command: test
        args: --lib --bins --verbose
      env:
        RUST_BACKTRACE: 1

  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.rust }}
        override: true
    
    - name: Build binary for integration tests
      uses: actions-rs/cargo@v1
      with:
        command: build
        args: --bin stalmarck_sat
    
    - name: Run integration tests
      uses: actions-rs/cargo@v1
      with:
        command: test
        args: --test integration_tests --verbose
      env:
        RUST_BACKTRACE: 1

  python-formatting:
    name: Python Formatting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install formatting tools
      run: |
        pip install black isort
    
    - name: Check Python formatting with black
      run: |
        black --check --diff python/
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff python/

  python-linting:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install linting tools
      run: |
        pip install flake8 mypy
    
    - name: Run flake8
      run: |
        flake8 python/ --max-line-length=88 --extend-ignore=E203,W503
    
    - name: Run mypy
      run: |
        mypy python/pystalmarck/ --ignore-missing-imports

  python-tests:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    
    - name: Install maturin and test dependencies
      run: |
        pip install maturin pytest
    
    - name: Build Python package
      run: |
        maturin develop
    
    - name: Run Python tests
      run: |
        cd python && python -m pytest tests/ -v
      env:
        RUST_BACKTRACE: 1

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, python-formatting, python-linting, python-tests]
    if: always()

    steps:
    - name: Check test results
      run: |
        if [[ "${{ needs.unit-tests.result }}" == "success" && \
              "${{ needs.integration-tests.result }}" == "success" && \
              "${{ needs.python-formatting.result }}" == "success" && \
              "${{ needs.python-linting.result }}" == "success" && \
              "${{ needs.python-tests.result }}" == "success" ]]; then
          echo "✅ All tests passed successfully!"
          exit 0
        else
          echo "❌ Some tests failed:"
          echo "  Unit tests: ${{ needs.unit-tests.result }}"
          echo "  Integration tests: ${{ needs.integration-tests.result }}"
          echo "  Python formatting: ${{ needs.python-formatting.result }}"
          echo "  Python linting: ${{ needs.python-linting.result }}"
          echo "  Python tests: ${{ needs.python-tests.result }}"
          exit 1
        fi